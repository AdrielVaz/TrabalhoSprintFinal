<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASKPI — Quadro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/MainScreenComponent/MainScreen.css?v=20260524-2">
</head>
<body>
    <header class="app-header">
        <div class="brand-wrap">
            <span class="logo-mark">T</span>
            <span class="brand">TASKPI</span>
            <span class="welcome-text">Bem vindo: <span style="font-weight:bold" id="NameUser"></span></span>
        </div>
        <div class="header-actions">
            <a class="profile-link" href="/perfil" title="Editar perfil">
                <span class="header-profile-avatar" id="headerProfileAvatar">U</span>
                <span class="header-profile-name" id="headerProfileName">Perfil</span>
            </a>
            <button type="button" class="btn-notification" id="btnConvites">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bell-fill" viewBox="0 0 16 16">
  <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2m.995-14.901a1 1 0 1 0-1.99 0A5 5 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901"/>
</svg> <span class="notification-count" id="conviteCount">0</span>
            </button>
            <button type="button" class="btn-leave" id="btnSair">← Sair</button>
        </div>
    </header>
    <div class="layout">
        <aside class="sidebar">
            <span class="sidebar-label">Seus projetos</span>
            <button type="button" class="btn-new-project" id="btnNovoProjeto">+ Novo projeto</button>
            <div class="projeto-list" id="projetoList"></div>
        </aside>
        <main class="board-wrap" id="boardWrap">
            <div class="empty-board" id="emptyState">
                <div class="empty-board-inner">
                    <div class="orb" aria-hidden="true"></div>
                    <p>Nenhum projeto selecionado. Escolha um à esquerda ou crie um novo para montar seu quadro.</p>
                </div>
            </div>
            <div id="boardContent">
                <div class="board-head">
                    <div>
                        <div class="board-title" id="boardTitle"></div>
                        <div class="board-meta" id="boardMeta"></div>
                        <div class="member-strip" id="projectMembers"></div>
                    </div>
                    <div class="board-actions">
                        <button type="button" class="board-action-btn btn-window" id="btnNovaAtividade">
                            <span class="window-icon" aria-hidden="true"></span>
                            <span>Nova atividade</span>
                        </button>
                        <button type="button" class="board-action-btn" id="btnCompartilhar">Compartilhar</button>
                    </div>
                </div>
                <div class="board-columns" id="boardColumns"></div>
            </div>
        </main>
    </div>

    <div class="toast-area" id="toastArea"></div>
    <div class="context-menu" id="contextMenu" role="menu"></div>

    <div class="modal fade" id="modalProjeto" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalProjetoTitle">Novo projeto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label fw-semibold small text-secondary">Nome</label>
                    <input type="text" class="form-control" id="inputProjetoDesc" placeholder="Ex.: Website, App mobile…">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnSalvarProjeto">Criar projeto</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalTarefa" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTarefaTitle">Tarefa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="tarefaId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Título</label>
                        <input type="text" class="form-control" id="tarefaTitulo" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Descrição</label>
                        <textarea class="form-control" id="tarefaDescricao" rows="4" placeholder="Detalhes, links, critérios…"></textarea>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-secondary">Prioridade</label>
                            <select class="form-select" id="tarefaPrioridade">
                                <option value="0">Alta</option>
                                <option value="1" selected>Média</option>
                                <option value="2">Baixa</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-secondary">Status</label>
                            <div class="form-check mt-2 pt-1">
                                <input class="form-check-input" type="checkbox" id="tarefaConcluida">
                                <label class="form-check-label" for="tarefaConcluida">Marcar como concluída</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer justify-content-between">
                    <button type="button" class="btn btn-outline-danger" id="btnExcluirTarefa" style="display: none;">Excluir</button>
                    <div class="ms-auto">
                        <button type="button" class="btn btn-light me-2" data-bs-dismiss="modal">Fechar</button>
                        <button type="button" class="btn btn-primary" id="btnSalvarTarefa">Salvar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalAtividade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalAtividadeTitle">Nova atividade</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Nome da atividade</label>
                        <input type="text" class="form-control" id="inputAtividadeNome" placeholder="Ex.: Design, Backend, Testes…">
                    </div>
                    <div class="mb-1">
                        <label class="form-label fw-semibold small text-secondary">Descrição <span class="fw-normal text-secondary">(opcional)</span></label>
                        <textarea class="form-control" id="inputAtividadeDesc" rows="3" placeholder="Descreva o objetivo desta atividade…"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnSalvarAtividade">Criar atividade</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalCompartilhar" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Compartilhar projeto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">E-mail do usuário</label>
                        <input type="email" class="form-control" id="inputCompartilharEmail" placeholder="usuario@exemplo.com">
                    </div>
                    <div class="mb-1">
                        <label class="form-label fw-semibold small text-secondary">Nível de acesso</label>
                        <div class="d-flex gap-2 mt-2" id="nivelAcessoOptions">
                            <label class="nivel-option flex-fill">
                                <input type="radio" name="nivelAcesso" value="0" class="d-none">
                                <div class="nivel-card">
                                    <span class="nivel-icon">A</span>
                                    <span class="nivel-label">Administrador</span>
                                    <span class="nivel-desc">Acesso total</span>
                                </div>
                            </label>
                            <label class="nivel-option flex-fill">
                                <input type="radio" name="nivelAcesso" value="1" class="d-none" checked>
                                <div class="nivel-card active">
                                    <span class="nivel-icon">O</span>
                                    <span class="nivel-label">Observador</span>
                                    <span class="nivel-desc">Somente leitura</span>
                                </div>
                            </label>
                            <label class="nivel-option flex-fill">
                                <input type="radio" name="nivelAcesso" value="2" class="d-none">
                                <div class="nivel-card">
                                    <span class="nivel-icon">H</span>
                                    <span class="nivel-label">Ajudante</span>
                                    <span class="nivel-desc">Pode editar</span>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnConfirmarCompartilhar">Enviar convite</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalRemoverMembro" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Remover participante</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label fw-semibold small text-secondary">Participante</label>
                    <div class="member-remove-list" id="listaRemoverMembros"></div>
                    <p class="invite-meta mt-2 mb-0">O dono do projeto não pode ser removido.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarRemoverMembro">Remover</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalConvites" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Convites recebidos</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="invite-list" id="conviteList"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <script src="/MainScreenComponent/MainScreen.js?v=20260524-2"></script>
</body>
</html>
