<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASKPI - Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/PerfilComponent/Perfil.css">
</head>
<body>
    <main class="profile-shell">
        <header class="profile-head">
            <h1>Editar perfil</h1>
            <a class="back-link" href="/mainscreen">Voltar ao quadro</a>
        </header>

        <section class="profile-body">
            <div class="avatar-area">
                <div class="profile-avatar" id="avatarPreview">U</div>
                <p class="photo-help">Use uma imagem quadrada para ficar melhor no avatar.</p>
            </div>

            <form class="profile-form" id="profileForm">
                <div class="alert" id="profileMessage"></div>

                <div>
                    <label class="form-label fw-semibold" for="nome">Nome</label>
                    <input class="form-control" id="nome" name="nome" type="text" maxlength="120" required>
                </div>

                <div>
                    <label class="form-label fw-semibold">Email</label>
                    <div class="readonly-email" id="email">Carregando...</div>
                </div>

                <div>
                    <label class="form-label fw-semibold" for="foto">Foto do perfil</label>
                    <input class="form-control" id="foto" name="foto" type="file" accept="image/*">
                </div>

                <div class="actions">
                    <button class="btn btn-primary" type="submit" id="saveBtn">Salvar alterações</button>
                    <a class="btn btn-outline-secondary" href="/mainscreen">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <script src="/PerfilComponent/Perfil.js"></script>
</body>
</html>
