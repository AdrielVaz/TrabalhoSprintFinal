<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASKPI - Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        :root {
            --bg: #0c1222;
            --panel: rgba(255, 255, 255, 0.96);
            --text: #0f172a;
            --muted: #64748b;
            --accent: #22d3ee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Outfit", system-ui, sans-serif;
            color: var(--text);
            background-color: var(--bg);
            background-image: radial-gradient(ellipse 90% 70% at 10% 0%, rgba(34, 211, 238, 0.18), transparent 48%), radial-gradient(ellipse 80% 60% at 100% 0%, rgba(99, 102, 241, 0.14), transparent 44%);
            display: grid;
            place-items: center;
            padding: 1rem;
        }

        .profile-shell {
            width: min(100%, 720px);
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
            overflow: hidden;
        }

        .profile-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 1.15rem;
            border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        }

        .profile-head h1 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .back-link {
            color: #0f172a;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
        }

        .profile-body {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 1.25rem;
            padding: 1.25rem;
        }

        .avatar-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
            padding: 1rem;
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 8px;
            background: #f8fafc;
        }

        .profile-avatar {
            width: 132px;
            height: 132px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #22d3ee, #6366f1);
            color: #0c1222;
            font-size: 3rem;
            font-weight: 800;
            border: 4px solid #fff;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-help {
            margin: 0;
            color: var(--muted);
            font-size: 0.82rem;
            text-align: center;
        }

        .profile-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .readonly-email {
            padding: 0.7rem 0.8rem;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid rgba(15, 23, 42, 0.08);
            color: var(--muted);
            word-break: break-word;
        }

        .actions {
            display: flex;
            gap: 0.7rem;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #0891b2;
            border-color: #0891b2;
            font-weight: 700;
        }

        .alert {
            display: none;
            margin: 0;
        }

        @media (max-width: 680px) {
            body {
                align-items: start;
            }

            .profile-body {
                grid-template-columns: 1fr;
            }

            .profile-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="profile-shell">
        <header class="profile-head">
            <h1>Editar perfil</h1>
            <a class="back-link" href="/mainscreen">Voltar ao quadro</a>
        </header>

        <section class="profile-body">
            <div class="avatar-area">
                <div class="profile-avatar" id="avatarPreview">U</div>
                <p class="photo-help">Use uma imagem quadrada para ficar melhor no avatar.</p>
            </div>

            <form class="profile-form" id="profileForm">
                <div class="alert" id="profileMessage"></div>

                <div>
                    <label class="form-label fw-semibold" for="nome">Nome</label>
                    <input class="form-control" id="nome" name="nome" type="text" maxlength="120" required>
                </div>

                <div>
                    <label class="form-label fw-semibold">Email</label>
                    <div class="readonly-email" id="email">Carregando...</div>
                </div>

                <div>
                    <label class="form-label fw-semibold" for="foto">Foto do perfil</label>
                    <input class="form-control" id="foto" name="foto" type="file" accept="image/*">
                </div>

                <div class="actions">
                    <button class="btn btn-primary" type="submit" id="saveBtn">Salvar alterações</button>
                    <a class="btn btn-outline-secondary" href="/mainscreen">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <script>
        const form = document.getElementById('profileForm');
        const nomeInput = document.getElementById('nome');
        const emailBox = document.getElementById('email');
        const fotoInput = document.getElementById('foto');
        const avatarPreview = document.getElementById('avatarPreview');
        const messageBox = document.getElementById('profileMessage');
        const saveBtn = document.getElementById('saveBtn');

        function showMessage(type, text) {
            messageBox.className = 'alert alert-' + type;
            messageBox.textContent = text;
            messageBox.style.display = 'block';
        }

        function renderAvatar(nome, fotoUrl) {
            avatarPreview.innerHTML = '';
            if (fotoUrl) {
                const img = document.createElement('img');
                img.src = fotoUrl;
                img.alt = nome || 'Foto do usuario';
                avatarPreview.appendChild(img);
                return;
            }

            avatarPreview.textContent = (nome || 'U').trim().charAt(0).toUpperCase() || 'U';
        }

        async function carregarPerfil() {
            const response = await fetch('/api/Usuarios/me', { credentials: 'include' });
            if (response.status === 401) {
                window.location.href = '/index.html';
                return;
            }

            const perfil = await response.json();
            nomeInput.value = perfil.nome || '';
            emailBox.textContent = perfil.email || '';
            localStorage.setItem('nomeUsuario', perfil.nome || '');
            localStorage.setItem('fotoPerfilUrl', perfil.fotoPerfilUrl || '');
            renderAvatar(perfil.nome, perfil.fotoPerfilUrl);
        }

        fotoInput.addEventListener('change', () => {
            const file = fotoInput.files && fotoInput.files[0];
            if (!file) {
                renderAvatar(nomeInput.value, localStorage.getItem('fotoPerfilUrl'));
                return;
            }

            renderAvatar(nomeInput.value, URL.createObjectURL(file));
        });

        nomeInput.addEventListener('input', () => {
            if (!fotoInput.files.length) {
                renderAvatar(nomeInput.value, localStorage.getItem('fotoPerfilUrl'));
            }
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            messageBox.style.display = 'none';

            const formData = new FormData();
            formData.append('nome', nomeInput.value.trim());
            if (fotoInput.files && fotoInput.files[0]) {
                formData.append('foto', fotoInput.files[0]);
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Salvando...';

            try {
                const response = await fetch('/api/Usuarios/me', {
                    method: 'PUT',
                    credentials: 'include',
                    body: formData
                });

                const payload = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(payload.message || 'Nao foi possivel salvar o perfil.');
                }

                localStorage.setItem('nomeUsuario', payload.nome || '');
                localStorage.setItem('fotoPerfilUrl', payload.fotoPerfilUrl || '');
                renderAvatar(payload.nome, payload.fotoPerfilUrl);
                fotoInput.value = '';
                showMessage('success', 'Perfil atualizado com sucesso.');
            } catch (error) {
                showMessage('danger', error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Salvar alterações';
            }
        });

        carregarPerfil().catch(() => showMessage('danger', 'Nao foi possivel carregar o perfil.'));
    </script>
</body>
</html>
