<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Recuperar senha</title>
    <link rel="stylesheet" href="/AuthComponent/EsqueciSenha.css">
</head>
<body>
    <main class="auth-card">
        <div class="brand-name">TASKPI</div>
        <p class="text-center hint mb-4">Informe seu e-mail para receber um link de redefinição de senha.</p>
        <div id="message" class="alert" style="display:none"></div>
        <form id="forgotForm">
            <div class="mb-3">
                <label class="form-label fw-semibold" for="email">Email</label>
                <input class="form-control" type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <button class="btn btn-primary w-100" type="submit" id="submitBtn">Enviar link</button>
        </form>
        <p class="text-center mt-3 mb-0"><a href="/">Voltar para login</a></p>
    </main>
    <script src="/AuthComponent/EsqueciSenha.js"></script>
</body>
</html>
