<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Recuperar senha</title>
    <style>
        :root {
            --bg-deep: #0c1222;
            --accent: #22d3ee;
            --text: #e8edf5;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Outfit", system-ui, sans-serif;
            color: var(--text);
            background-color: var(--bg-deep);
            background-image: radial-gradient(ellipse 120% 80% at 10% -20%, rgba(34, 211, 238, 0.18), transparent 50%), radial-gradient(ellipse 90% 60% at 100% 0%, rgba(99, 102, 241, 0.14), transparent 45%);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .auth-card {
            width: min(420px, 100%);
            padding: 32px;
            background: #fff;
            color: #0f172a;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.24);
        }

        .brand-name {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
        }

        .hint {
            color: #64748b;
            font-size: 0.92rem;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>
    <main class="auth-card">
        <div class="brand-name">TASKPI</div>
        <p class="text-center hint mb-4">Informe seu e-mail para receber um link de redefinição de senha.</p>
        <div id="message" class="alert" style="display:none"></div>
        <form id="forgotForm">
            <div class="mb-3">
                <label class="form-label fw-semibold" for="email">Email</label>
                <input class="form-control" type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <button class="btn btn-primary w-100" type="submit" id="submitBtn">Enviar link</button>
        </form>
        <p class="text-center mt-3 mb-0"><a href="/">Voltar para login</a></p>
    </main>
    <script>
        const form = document.getElementById('forgotForm');
        const message = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        function showMessage(type, text) {
            message.className = 'alert ' + (type === 'error' ? 'alert-danger' : 'alert-success');
            message.textContent = text;
            message.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';

            try {
                const response = await fetch('/api/Auth/esqueci-senha', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value.trim() })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.message || 'Não foi possível enviar o link.');
                showMessage('success', data.message || 'Verifique seu e-mail.');
            } catch (error) {
                showMessage('error', error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar link';
            }
        });
    </script>
</body>
</html>
