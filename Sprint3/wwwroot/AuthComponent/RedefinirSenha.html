<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Redefinir senha</title>
    <link rel="stylesheet" href="/AuthComponent/RedefinirSenha.css">
</head>
<body>
    <main class="auth-card">
        <div class="brand-name">TASKPI</div>
        <p class="text-center text-secondary mb-4">Crie uma nova senha para sua conta.</p>
        <div id="message" class="alert" style="display:none"></div>
        <form id="resetForm">
            <div class="mb-3">
                <label class="form-label fw-semibold" for="password">Nova senha</label>
                <input class="form-control" type="password" id="password" minlength="6" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold" for="confirmPassword">Confirmar senha</label>
                <input class="form-control" type="password" id="confirmPassword" minlength="6" required>
            </div>
            <button class="btn btn-primary w-100" type="submit" id="submitBtn">Alterar senha</button>
        </form>
        <p class="text-center mt-3 mb-0"><a href="/">Voltar para login</a></p>
    </main>
    <script src="/AuthComponent/RedefinirSenha.js"></script>
</body>
</html>
