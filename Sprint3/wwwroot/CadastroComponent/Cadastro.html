<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Tela de Cadastro</title>
    <style>
        :root {
            --bg-deep: #0c1222;
            --accent: #22d3ee;
            --accent-dim: rgba(34, 211, 238, 0.15);
            --text: #e8edf5;
            --text-muted: #8b9cb8;
            --sidebar-bg: rgba(18, 26, 46, 0.72);
            --sidebar-border: rgba(255, 255, 255, 0.06);
            --list-bg: rgba(248, 250, 252, 0.97);
            --list-border: rgba(15, 23, 42, 0.06);
            --card-bg: #ffffff;
            --column-width: 286px;
            --header-h: 56px;
            --radius-lg: 14px;
            --radius-md: 10px;
            --shadow-card: 0 4px 14px rgba(15, 23, 42, 0.08), 0 0 1px rgba(15, 23, 42, 0.06);
            --shadow-card-hover: 0 10px 28px rgba(15, 23, 42, 0.12), 0 0 1px rgba(15, 23, 42, 0.08);
        }

        body {
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
            font-family: "Outfit", system-ui, sans-serif;
            color: var(--text);
            background-color: var(--bg-deep);
            background-image: radial-gradient(ellipse 120% 80% at 10% -20%, rgba(34, 211, 238, 0.18), transparent 50%), radial-gradient(ellipse 90% 60% at 100% 0%, rgba(99, 102, 241, 0.14), transparent 45%), radial-gradient(ellipse 70% 50% at 50% 100%, rgba(14, 165, 233, 0.12), transparent 55%);
            background-attachment: fixed;
        }

        .input-group-text {
            cursor: pointer;
        }

        .container {
            display: flex;
            flex-direction: column;
            margin: 40px auto;
            width: min(400px, calc(100% - 32px));
            padding: 32px 40px;
            background: rgb(255, 255, 255);
            border-radius: 3px;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 0px 10px;
            box-sizing: border-box;
        }

        .img-h1 {
            text-align: center;
        }

        .img-icon {
            width: 100px;
        }

        .brand-name {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(90deg, #999, #ccc, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        .form-label {
            font-weight: bold;
        }

        .terms {
            margin-bottom: 25px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        #terms {
            margin-top: 10px;
        }

        .form-label {
            font-weight: bold;
        }

        label {
            color: black
        }

        p {
            color: black
        }

        @media (max-width: 480px) {
            body {
                display: grid;
                place-items: center;
                padding: 18px 0;
            }

            .container {
                margin: 0 auto;
                padding: 24px 18px;
            }

            .img-icon {
                width: 78px;
            }

            .terms {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="text-cente">
            <h1 class="img-h1"><img src="../Assets/ChatGPT Image 6 de mai. de 2026, 11_17_50.png" class="img-icon"
                    alt=""></h1>
            <p class="text-center text-primary fw-bold">Criar Conta</p>
            <p class="text-center text-secondary fw-bold">preencha os dados</p>
        </div>

        <div id="errorMessage" class="text-danger"></div>
        <div id="successMessage" class="text-successful"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label" for="name">Nome Completo</label>
                <div class="input-group">
                    <i class="input-group-text"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
                            <path
                                d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
                        </svg></i>
                    <input class="form-control" type="text" id="name" name="name" placeholder="Digite seu nome completo"
                        required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <div class="input-group">
                    <i class="input-group-text"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            fill="currentColor" class="bi bi-envelope-at-fill" viewBox="0 0 16 16">
                            <path
                                d="M2 2A2 2 0 0 0 .05 3.555L8 8.414l7.95-4.859A2 2 0 0 0 14 2zm-2 9.8V4.698l5.803 3.546zm6.761-2.97-6.57 4.026A2 2 0 0 0 2 14h6.256A4.5 4.5 0 0 1 8 12.5a4.49 4.49 0 0 1 1.606-3.446l-.367-.225L8 9.586zM16 9.671V4.697l-5.803 3.546.338.208A4.5 4.5 0 0 1 12.5 8c1.414 0 2.675.652 3.5 1.671" />
                            <path
                                d="M15.834 12.244c0 1.168-.577 2.025-1.587 2.025-.503 0-1.002-.228-1.12-.648h-.043c-.118.416-.543.643-1.015.643-.77 0-1.259-.542-1.259-1.434v-.529c0-.844.481-1.4 1.26-1.4.585 0 .87.333.953.63h.03v-.568h.905v2.19c0 .272.18.42.411.42.315 0 .639-.415.639-1.39v-.118c0-1.277-.95-2.326-2.484-2.326h-.04c-1.582 0-2.64 1.067-2.64 2.724v.157c0 1.867 1.237 2.654 2.57 2.654h.045c.507 0 .935-.07 1.18-.18v.731c-.219.1-.643.175-1.237.175h-.044C10.438 16 9 14.82 9 12.646v-.214C9 10.36 10.421 9 12.485 9h.035c2.12 0 3.314 1.43 3.314 3.034zm-4.04.21v.227c0 .586.227.8.581.8.31 0 .564-.17.564-.743v-.367c0-.516-.275-.708-.572-.708-.346 0-.573.245-.573.791" />
                        </svg></i>
                    <input class="form-control" type="email" id="email" name="email" placeholder="seu@email.com"
                        required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Senha</label>
                <div class="input-group">
                    <i class="input-group-text"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            fill="currentColor" class="bi bi-lock-fill" viewBox="0 0 16 16">
                            <path fill-rule="evenodd"
                                d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3" />
                        </svg></i>

                    <input class="form-control" type="password" id="password" name="password"
                        placeholder="Crie uma senha forte" required>

                    <span class="input-group-text toggle-password" onclick="togglePassword()">Mostrar</span>
                </div>

                <div class="password-strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>

                <small id="strengthText"></small>
            </div>

            <div class="mb-3">
                <label class="form-label" for="confirmPassword">Confirmar Senha</label>
                <div class="input-group">
                    <i class="input-group-text"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            fill="currentColor" class="bi bi-lock-fill" viewBox="0 0 16 16">
                            <path fill-rule="evenodd"
                                d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3" />
                        </svg></i>
                    <input class="form-control" type="password" id="confirmPassword" name="confirmPassword"
                        placeholder="Confirme sua senha" required>
                </div>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    Eu concordo com os <a href="">Termos de Serviço</a> e <a href="">Política de Privacidade</a>
                </label>
            </div>

            <button class="btn btn-primary w-100" type="submit" id="submitBtn">Cadastrar</button>
        </form>

        <div class="login-link">
            <p>Já tem uma conta? <a href="/">Faça login</a></p>
        </div>
        <div class="brand-name">TASKPI</div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'Ocultar';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'Mostrar';
            }
        }

        function showMessage(type, message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            if (type === 'error') {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                successDiv.style.display = 'none';

                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 3000);
            } else if (type === 'success') {
                successDiv.textContent = message;
                successDiv.style.display = 'block';
                errorDiv.style.display = 'none';
            }
        }

        function checkPasswordStrength(password) {
            let strength = 0;
            let message = '';

            if (password.length === 0) {
                return { strength: 0, message: 'Digite uma senha' };
            }

            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            switch (strength) {
                case 0:
                case 1:
                    message = 'Senha fraca';
                    break;
                case 2:
                case 3:
                    message = 'Senha média';
                    break;
                case 4:
                case 5:
                    message = 'Senha forte';
                    break;
            }

            return { strength: Math.min(strength, 5), message };
        }

        function updatePasswordStrength() {
            const password = document.getElementById('password').value;
            const { strength, message } = checkPasswordStrength(password);
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');

            let width = (strength / 5) * 100;
            let color = '';

            if (strength <= 2) {
                color = '#ff4444';
            } else if (strength <= 3) {
                color = '#ffaa44';
            } else {
                color = '#44ff44';
            }

            strengthBar.style.width = width + '%';
            strengthBar.style.backgroundColor = color;
            strengthText.textContent = message;
            strengthText.style.color = color;
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validateName(name) {
            return name.trim().length >= 3;
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        function validateForm() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;

            if (!validateName(name)) {
                showMessage('error', 'Nome deve ter pelo menos 3 caracteres!');
                return false;
            }

            if (!validateEmail(email)) {
                showMessage('error', 'Por favor, insira um email válido!');
                return false;
            }

            if (!validatePassword(password)) {
                showMessage('error', 'A senha deve ter pelo menos 6 caracteres!');
                return false;
            }

            if (password !== confirmPassword) {
                showMessage('error', 'As senhas não coincidem!');
                return false;
            }

            if (!terms) {
                showMessage('error', 'Você precisa aceitar os termos para continuar!');
                return false;
            }

            return true;
        }

        async function registerUser(userData) {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(userData)
            });

            let payload = {};
            try {
                payload = await response.json();
            } catch {
                payload = {};
            }

            if (!response.ok) {
                throw new Error(payload.message || 'Erro ao cadastrar usuario.');
            }

            return payload;
        }

        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            if (!validateForm()) {
                return;
            }

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Cadastrando...';

            const userData = {
                nome: name,
                email: email,
                senha: password
            };

            try {
                await registerUser(userData);
                showMessage('success', 'Cadastro realizado. Verifique seu email para confirmar a conta.');

                document.getElementById('registerForm').reset();
                updatePasswordStrength();

                setTimeout(() => {
                    window.location.href = '/';
                }, 2500);
            } catch (error) {
                showMessage('error', error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Cadastrar';
            }
        });

        document.getElementById('password').addEventListener('input', updatePasswordStrength);

        document.getElementById('confirmPassword').addEventListener('input', function () {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;

            if (password !== confirmPassword && confirmPassword.length > 0) {
                this.style.borderColor = '#ff4444';
            } else {
                this.style.borderColor = '#e1e1e1';
            }
        });

        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', function () {
                this.parentElement.style.transform = 'scale(1.02)';
            });

            input.addEventListener('blur', function () {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
