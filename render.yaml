services:
  - type: web
    name: taskpi
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Issuer
        value: TarefasTASPI
      - key: Jwt__Audience
        value: Sprint3Client
      - key: Jwt__SecretKey
        sync: false
      - key: Email__Smtp__Host
        value: smtp.gmail.com
      - key: Email__Smtp__Port
        value: 587
      - key: Email__Smtp__EnableSsl
        value: true
      - key: Email__Smtp__Username
        sync: false
      - key: Email__Smtp__Password
        sync: false
      - key: Email__Smtp__From
        sync: false
      - key: Email__Smtp__FromName
        value: TASKPI
      - key: Email__Provider
        value: Resend
      - key: Email__Resend__ApiKey
        sync: false
      - key: Email__Resend__From
        sync: false
      - key: Email__Resend__FromName
        value: TASKPI
